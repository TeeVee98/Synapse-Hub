# Enterprise GitLab CI/CD Pipeline Blueprint (Synapse Hub)
# Conforms to ISO/IEC/IEEE 29119-3/4, ISO/IEC 25010:2023, and OWASP Standards

default:
  timeout: 30m
  interruptible: true

stages:
  - static-analysis
  - test
  - performance
  - acceptance

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - .cache/pip/
    - .npm/

# ==============================================================================
# STAGE 1: Static Defect & Security Sentinel
# ==============================================================================
static-defect-sentinel:
  stage: static-analysis
  image: python:3.12-slim
  before_script:
    - pip install ruff pytest
  script:
    - python tools/core/verify_all.py --mode hub
    - python tools/perf/mobile_resilience_sentinel.py --sample
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'

# ==============================================================================
# STAGE 2: REST API Automation Suite (Sprint 1)
# ==============================================================================
api-automation-suite:
  stage: test
  image: python:3.12-slim
  needs: ["static-defect-sentinel"]
  before_script:
    - pip install requests pydantic pytest
  script:
    - mkdir -p reports
    - pytest tests/aut_api -v --junitxml=reports/api_junit.xml
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: reports/api_junit.xml
    paths:
      - reports/api_junit.xml

# ==============================================================================
# STAGE 2: Playwright Web UI CRM E2E & DAST Suite (Sprint 2 & 3)
# ==============================================================================
playwright-e2e-suite:
  stage: test
  image: mcr.microsoft.com/playwright:v1.49.0-noble
  needs: ["static-defect-sentinel"]
  before_script:
    - cd examples/playwright-crm-suite
    - npm ci
  script:
    - npx playwright test
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: examples/playwright-crm-suite/reports/junit.xml
    paths:
      - examples/playwright-crm-suite/playwright-report/
      - examples/playwright-crm-suite/reports/junit.xml

# ==============================================================================
# STAGE 2: Mobile Screen Object Model (SOM) Suite (Sprint 5)
# ==============================================================================
mobile-som-suite:
  stage: test
  image: python:3.12-slim
  needs: ["static-defect-sentinel"]
  before_script:
    - pip install pytest
  script:
    - mkdir -p reports
    - pytest examples/mobile-crm-suite/tests -v --junitxml=reports/mobile_junit.xml
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: reports/mobile_junit.xml
    paths:
      - reports/mobile_junit.xml

# ==============================================================================
# STAGE 3: Performance & SLA Sentinel (Sprint 4)
# ==============================================================================
perf-sla-sentinel:
  stage: performance
  image: python:3.12-slim
  needs: ["api-automation-suite", "playwright-e2e-suite"]
  before_script:
    - pip install requests
  script:
    - mkdir -p Reports/perf
    - python tools/perf/benchmark_perf_runner.py
    - python tools/perf/jtl_analyzer.py Reports/perf/perf_results.jtl --sla-p95 500 --max-error-rate 1.0
    - python -c "from tools.core.gates.gate_10_perf_sla import gate_10_performance_sla; import os; assert gate_10_performance_sla(os.getcwd(), 'HUB')"
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - Reports/perf/

# ==============================================================================
# STAGE 4: Final Definition of Done (DoD) Gatekeeper
# ==============================================================================
dod-acceptance-gatekeeper:
  stage: acceptance
  image: python:3.12-slim
  needs: ["api-automation-suite", "playwright-e2e-suite", "mobile-som-suite", "perf-sla-sentinel"]
  script:
    - python tools/report/ci_summary_generator.py
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'
