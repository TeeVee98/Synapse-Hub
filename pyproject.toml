[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-qa"
version = "2.4.3"
description = "Enterprise AI Agent Quality Engineering & Test Automation Hub"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Thế Vị (@TeeVee998)", email = "teevee998@users.noreply.github.com" }
]
keywords = ["qa", "testing", "ai-agents", "playwright", "clean-pom", "quality-gates"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance"
]
dependencies = []

[project.urls]
Homepage = "https://github.com/TeeVee998/Synapse-Hub"
Repository = "https://github.com/TeeVee998/Synapse-Hub"
Issues = "https://github.com/TeeVee998/Synapse-Hub/issues"

[project.optional-dependencies]
excel = ["openpyxl>=3.1.0"]
vision = ["Pillow>=10.0.0"]
treesitter = ["tree-sitter>=0.21.0", "tree-sitter-languages>=1.10.0"]
all = ["openpyxl>=3.1.0", "Pillow>=10.0.0", "pytest>=8.0.0", "tree-sitter>=0.21.0", "tree-sitter-languages>=1.10.0"]

[project.scripts]
agent-qa = "tools.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tools*"]

[tool.setuptools.package-data]
tools = ["*.json", "*.db", "*.js", "*.ps1", "*.sh"]

[tool.coverage.run]
source = ["tools"]
omit = [
    "tools/templates/*",
    "tests/*",
]

[tool.coverage.report]
# Target full-suite coverage threshold is 80%. Baseline offline CI gate is set to 60%+.
fail_under = 60
show_missing = true
skip_covered = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "2.4.3"
exclude = [
    ".git",
    ".agents",
    "templates",
    "claude-ecosystem-repos",
    "benchmarks",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "2.4.3"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "templates/",
    "claude-ecosystem-repos/",
    "benchmarks/",
]

