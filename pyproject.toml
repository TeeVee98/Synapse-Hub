[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-qa"
version = "3.2.4"
description = "Enterprise AI Agent Quality Engineering & Test Automation Hub"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Thế Vị (@TeeVee998)", email = "teevee998@users.noreply.github.com" }
]
keywords = ["qa", "testing", "ai-agents", "playwright", "clean-pom", "quality-gates"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance"
]
dependencies = []

[project.urls]
Homepage = "https://github.com/TeeVee998/Synapse-Hub"
Repository = "https://github.com/TeeVee998/Synapse-Hub"
Issues = "https://github.com/TeeVee998/Synapse-Hub/issues"

[project.optional-dependencies]
excel = ["openpyxl>=3.1.0"]
vision = ["Pillow>=10.0.0"]
treesitter = ["tree-sitter>=0.21.0", "tree-sitter-languages>=1.10.0"]
all = ["openpyxl>=3.1.0", "Pillow>=10.0.0", "pytest>=8.0.0", "tree-sitter>=0.21.0", "tree-sitter-languages>=1.10.0"]

[project.scripts]
agent-qa = "tools.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tools*", "templates*"]

[tool.setuptools.package-data]
tools = ["*.json", "*.db", "*.js", "*.ps1", "*.sh", "*.tmpl"]
templates = ["*.md", "*.tmpl", "**/*.md", "**/*.yml", "**/*.mdc", "**/windsurfrules", "**/CLAUDE.md"]

[tool.coverage.run]
source = ["tools"]
omit = [
    "tools/templates/*",
    "tests/*",
]

[tool.coverage.report]
# Target full-suite coverage threshold is 80%. Raised step-ladder floor to 52%+ in Phase 3.
fail_under = 52
show_missing = true
skip_covered = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".git",
    ".agents",
    "templates",
    "claude-ecosystem-repos",
    "benchmarks",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests and standalone CLI tools require sys.path injection before local module imports
"tests/*" = ["E402"]
"tools/*" = ["E402"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
disable_error_code = ["union-attr", "var-annotated", "no-redef"]
exclude = [
    "templates/",
    "claude-ecosystem-repos/",
    "benchmarks/",
]

[tool.bandit]
# Static Application Security Testing (SAST) Configuration
# Suppressions with explicit enterprise rationale:
# - B103: chmod 0o755 for POSIX CLI wrapper scripts (omni-qc)
# - B314: Standard library xml.etree for zero-dependency local JUnit XML and offline xlsx parsing
# - B608: Local SQLite cache queries with parameterized '?' bindings (zero public SQL exposure)
skips = ["B103", "B314", "B608"]
exclude_dirs = [
    "tests",
    "templates",
    "claude-ecosystem-repos",
    "benchmarks",
]

