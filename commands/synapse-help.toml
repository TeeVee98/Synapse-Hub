description = "Quick reference for lean senior dev levels, skills, and commands"
prompt = "Show the lean senior dev quick reference. One shot, change nothing: do not switch mode, write flag files, or persist anything. Levels: /synapse-ladder lite (build what is asked, name the lazier alternative in one line), /synapse-ladder (full, the default 7-rung ladder: YAGNI then existing codebase then stdlib then native then one line then minimum), /synapse-ladder ultra (deletion before addition, challenges requirements before building). Commands: /synapse-review (quality review of current changes: bugs, security, scale, tests, bloat), /synapse-audit (whole-repo quality audit with 'Fix this first' ranking), /synapse-debt (harvest shortcut: comments into a tracked ledger), /synapse-gain (measured-impact scoreboard from benchmarks), /synapse-help (this card). Also supports /ponytail-* aliases. Change no code."
