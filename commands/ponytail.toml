description = "Switch ponytail intensity level (lite/full/ultra/off)"
prompt = "Switch to ponytail {{args}} mode. With no level, keep current level, or switch on at the default level if off. Before writing any code: does it need to exist at all (YAGNI)? Does the codebase already have a helper or component? Does the standard library do it? A native platform feature? Can it be one clear line? Build the minimum that works. No unrequested abstractions, no avoidable dependencies, no boilerplate. Mark deliberate simplifications that cut a real corner with a known ceiling using a shortcut: comment that names the ceiling and upgrade path."
