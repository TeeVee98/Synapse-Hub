name: Cleanup Old NPM Versions

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "CONFIRM_UNPUBLISH" to confirm destructive unpublish'
        required: true
        type: string
      otp:
        description: '6-digit OTP from your Authenticator app (e.g. 123456)'
        required: true
        type: string

jobs:
  cleanup-npm:
    name: Deprecate and Unpublish Old NPM Versions
    environment: npm-release
    runs-on: ubuntu-latest
    if: inputs.confirm == 'CONFIRM_UNPUBLISH'
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Validate OTP Format
        run: |
          if ! [[ "$OTP_INPUT" =~ ^[0-9]{6}$ ]]; then
            echo "Error: Invalid OTP format. Expected 6 digits."
            exit 1
          fi
        env:
          OTP_INPUT: ${{ inputs.otp }}

      - name: Deprecate versions prior to 3.0.1
        run: |
          npm deprecate synapse-hub@"< 3.0.1" "Phien ban cu da bi thu hoi do cap nhat bao mat & tinh nang. Vui long su dung ban chinh thuc synapse-hub@3.0.1 tro len." --otp="$OTP_INPUT"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          OTP_INPUT: ${{ inputs.otp }}

      - name: Unpublish recent versions (< 72h)
        run: |
          npm unpublish synapse-hub@3.0.0 --force --otp="$OTP_INPUT" || echo "3.0.0 unpublish skipped"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          OTP_INPUT: ${{ inputs.otp }}
