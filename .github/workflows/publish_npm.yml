name: Publish Package (GitHub Packages & NPM)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      otp:
        description: 'NPM 2FA OTP Code (optional)'
        required: false
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-verify:
    name: Verify Quality Gates & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.9 (Lowest Supported Version)
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Tag matches Universal Version Synchronization
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VER="${GITHUB_REF#refs/tags/v}"
          python3 tools/check_version_sync.py --expected-version "$TAG_VER"

      - name: Verify Universal Version Synchronization
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: |
          python3 tools/check_version_sync.py

      - name: Run 9 Quality Gates DoD Verification
        run: |
          python tools/verify_all.py --mode hub

      - name: Run Automated Test Suites
        run: |
          python -m unittest discover tests -p "test_*.py"

  publish-github-packages:
    name: Publish to GitHub Packages
    needs: build-and-verify
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js for GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@teevee998'

      - name: Configure Scope for GitHub Packages
        run: |
          npm pkg set name=@teevee998/synapse-hub publishConfig.registry=https://npm.pkg.github.com

      - name: Publish to GitHub Packages Registry
        run: |
          OUTPUT=$(npm publish 2>&1) || {
            EXIT_CODE=$?
            if echo "$OUTPUT" | grep -qiE "EPUBLISHCONFLICT|previously published|already exists|existing version|409 Conflict"; then
              echo "Version already published on GitHub Packages, skipping."
            else
              echo "$OUTPUT"
              exit $EXIT_CODE
            fi
          }
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    name: Publish to NPM Registry
    needs: build-and-verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm CLI to pinned version
        run: npm install -g npm@10.8.2

      - name: Publish to NPM via Token or Trusted Publishing
        run: |
          OTP_ARG=""
          if [ -n "$OTP_INPUT" ]; then
            if ! [[ "$OTP_INPUT" =~ ^[0-9]{6}$ ]]; then
              echo "Error: Invalid OTP format. Expected 6 digits."
              exit 1
            fi
            OTP_ARG="--otp=$OTP_INPUT"
          fi
          OUTPUT=$(npm publish --provenance --access public $OTP_ARG 2>&1) || {
            EXIT_CODE=$?
            if echo "$OUTPUT" | grep -qiE "EPUBLISHCONFLICT|previously published|already exists|existing version|409 Conflict"; then
              echo "Version already published on NPM Registry, skipping."
              exit 0
            fi
            echo "$OUTPUT"
            exit $EXIT_CODE
          }
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          OTP_INPUT: ${{ inputs.otp }}
