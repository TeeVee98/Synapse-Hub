name: Publish Package (GitHub Packages & NPM)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      otp:
        description: 'NPM 2FA OTP Code (optional)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Verify Quality Gates & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.10 (Lowest Supported Version)
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify Tag matches Universal Version Synchronization
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VER="${GITHUB_REF#refs/tags/v}"
          python3 tools/check_version_sync.py --expected-version "$TAG_VER"

      - name: Verify Universal Version Synchronization
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: |
          python3 tools/check_version_sync.py

      - name: Run 10 Quality Gates DoD Verification
        run: |
          python tools/verify_all.py --mode hub

      - name: Run Automated Test Suites
        run: |
          python -m unittest discover tests -p "test_*.py"

  publish-github-packages:
    name: Publish to GitHub Packages
    needs: build-and-verify
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js for GitHub Packages
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@teevee998'

      - name: Configure Scope for GitHub Packages
        run: |
          npm pkg set name=@teevee998/synapse-hub publishConfig.registry=https://npm.pkg.github.com

      - name: Publish to GitHub Packages Registry
        run: |
          OUTPUT=$(npm publish 2>&1) || {
            EXIT_CODE=$?
            if echo "$OUTPUT" | grep -qiE "EPUBLISHCONFLICT|previously published|already exists|existing version|409 Conflict"; then
              echo "Version already published on GitHub Packages, skipping."
            else
              echo "$OUTPUT"
              exit $EXIT_CODE
            fi
          }
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    name: Publish to NPM Registry
    needs: build-and-verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'

      - name: Upgrade npm CLI for OIDC Trusted Publishing
        run: npm install -g npm@latest

      - name: Publish to NPM via Trusted Publishing (OIDC) or Token Fallback
        run: |
          OTP_ARG=""
          if [ -n "$OTP_INPUT" ]; then
            if ! [[ "$OTP_INPUT" =~ ^[0-9]{6}$ ]]; then
              echo "Error: Invalid OTP format. Expected 6 digits."
              exit 1
            fi
            OTP_ARG="--otp=$OTP_INPUT"
          fi

          # If ACTIONS_ID_TOKEN_REQUEST_URL is present, GitHub Actions OIDC is active.
          # For Trusted Publishing, clean up .npmrc and omit NODE_AUTH_TOKEN so npm uses OIDC.
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "🚀 Authenticating via npm Trusted Publishing (OIDC / Provenance)..."
            rm -f ~/.npmrc
            unset NODE_AUTH_TOKEN
          elif [ -n "$LEGACY_TOKEN" ]; then
            echo "🔑 Falling back to legacy NPM_TOKEN authentication..."
            echo "//registry.npmjs.org/:_authToken=$LEGACY_TOKEN" > ~/.npmrc
          fi

          OUTPUT=$(npm publish --provenance --access public $OTP_ARG 2>&1)
          EXIT_CODE=$?
          echo "$OUTPUT"
          if [ $EXIT_CODE -ne 0 ]; then
            if echo "$OUTPUT" | grep -qiE "EPUBLISHCONFLICT|previously published|already exists|existing version|409 Conflict"; then
              echo "Version already published on NPM Registry, skipping."
              exit 0
            fi
            exit $EXIT_CODE
          fi
        env:
          LEGACY_TOKEN: ${{ secrets.NPM_TOKEN }}
          OTP_INPUT: ${{ inputs.otp }}

  create-release:
    name: Create GitHub Release
    needs: [build-and-verify, publish-npm]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }} — Release ${{ github.ref_name }}
          generate_release_notes: true
