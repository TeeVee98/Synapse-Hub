name: Publish Package (GitHub Packages & NPM)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      otp:
        description: 'NPM 2FA OTP Code (optional)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Verify Quality Gates & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.10 (Lowest Supported Version)
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify Tag matches Universal Version Synchronization
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VER="${GITHUB_REF#refs/tags/v}"
          python3 tools/core/check_version_sync.py --expected-version "$TAG_VER"

      - name: Verify Universal Version Synchronization
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: |
          python3 tools/core/check_version_sync.py

      - name: Run 10 Quality Gates DoD Verification
        run: |
          python tools/core/verify_all.py --mode hub

      - name: Run Automated Test Suites & Code Coverage
        env:
          SYNAPSE_API_OFFLINE: "1"
        run: |
          python -m pytest tests -q --cov=tools --cov-fail-under=60

  publish-github-packages:
    name: Publish to GitHub Packages
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js for GitHub Packages
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '22.x'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@${{ github.repository_owner }}'

      - name: Configure Scope for GitHub Packages
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          npm pkg set name="@${OWNER_LOWER}/synapse-hub" publishConfig.registry=https://npm.pkg.github.com

      - name: Publish to GitHub Packages Registry
        run: |
          OUTPUT=$(npm publish 2>&1) || {
            EXIT_CODE=$?
            if echo "$OUTPUT" | grep -qiE "EPUBLISHCONFLICT|previously published|already exists|409 Conflict"; then
              echo "::notice::Version already published on GitHub Packages, skipping duplicate release."
              exit 0
            else
              echo "::error::Publishing to GitHub Packages failed with error:"
              echo "$OUTPUT"
              exit $EXIT_CODE
            fi
          }
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    name: Publish to NPM Registry
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Node.js 24 for NPM Registry
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to NPM via Trusted Publishing (OIDC Provenance) or NPM_TOKEN Fallback
        run: |
          OTP_ARG=""
          if [ -n "$OTP_INPUT" ]; then
            if ! [[ "$OTP_INPUT" =~ ^[0-9]{6}$ ]]; then
              echo "Error: Invalid OTP format. Expected 6 digits."
              exit 1
            fi
            OTP_ARG="--otp=$OTP_INPUT"
          fi

          echo "🚀 Initializing NPM Publish environment..."
          echo "  Node version : $(node -v)"
          echo "  NPM version  : $(npx --yes npm@latest -v)"

          echo "🚀 Attempting publish via npm Trusted Publishing (OIDC / Provenance)..."
          rm -f ~/.npmrc
          if npx --yes npm@latest publish --provenance --access public $OTP_ARG; then
            echo "✅ Successfully published to NPM via OIDC Trusted Publishing!"
            exit 0
          fi

          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "⚠️ OIDC Trusted Publishing unconfigured or rejected. Falling back to NPM_TOKEN authentication..."
            echo "//registry.npmjs.org/:_authToken=$NODE_AUTH_TOKEN" > ~/.npmrc
            OUTPUT=$(npx --yes npm@latest publish --access public $OTP_ARG 2>&1) || {
              EXIT_CODE=$?
              if echo "$OUTPUT" | grep -qiE "EPUBLISHCONFLICT|previously published|already exists|409 Conflict"; then
                echo "::notice::Version already published on NPM Registry, skipping duplicate release."
                exit 0
              else
                echo "::error::Publishing to NPM failed with error:"
                echo "$OUTPUT"
                exit $EXIT_CODE
              fi
            }
            echo "✅ Successfully published to NPM Registry via NPM_TOKEN!"
            exit 0
          else
            echo "❌ NPM Publish failed and no NPM_TOKEN was available."
            exit 1
          fi
        env:
          OTP_INPUT: ${{ inputs.otp }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  create-release:
    name: Create GitHub Release
    needs: [build-and-verify]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python for Release Artifact Generation
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.10'

      - name: Generate SPDX SBOM
        run: |
          mkdir -p reports
          python tools/report/generate_sbom.py --output reports/synapse_hub_sbom.spdx.json

      - name: Package Release Archives and Provenance Checksums
        run: |
          python tools/core/package_release.py --output-dir dist --format both --with-checksum

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          name: ${{ github.ref_name }} — Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            reports/synapse_hub_sbom.spdx.json
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
