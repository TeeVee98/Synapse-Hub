name: Publish Package (GitHub Packages & NPM)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      otp:
        description: 'NPM 2FA OTP Code (optional)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Verify Quality Gates & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.10 (Lowest Supported Version)
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify Tag matches Universal Version Synchronization
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VER="${GITHUB_REF#refs/tags/v}"
          python3 tools/check_version_sync.py --expected-version "$TAG_VER"

      - name: Verify Universal Version Synchronization
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: |
          python3 tools/check_version_sync.py

      - name: Run 11 Quality Gates DoD Verification
        run: |
          python tools/verify_all.py --mode hub

      - name: Run Automated Test Suites
        run: |
          python -m unittest discover tests -p "test_*.py"

  publish-github-packages:
    name: Publish to GitHub Packages
    needs: build-and-verify
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js for GitHub Packages
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@${{ github.repository_owner }}'

      - name: Configure Scope for GitHub Packages
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          npm pkg set name="@${OWNER_LOWER}/synapsehub" publishConfig.registry=https://npm.pkg.github.com

      - name: Publish to GitHub Packages Registry
        run: |
          OUTPUT=$(npm publish 2>&1) || {
            EXIT_CODE=$?
            if echo "$OUTPUT" | grep -qiE "EPUBLISHCONFLICT|previously published|already exists|existing version|409 Conflict"; then
              echo "Version already published on GitHub Packages, skipping."
            else
              echo "$OUTPUT"
              exit $EXIT_CODE
            fi
          }
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    name: Publish to NPM Registry
    needs: build-and-verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js 24 for NPM Registry
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to NPM via Trusted Publishing (OIDC) or Token Fallback
        run: |
          OTP_ARG=""
          if [ -n "$OTP_INPUT" ]; then
            if ! [[ "$OTP_INPUT" =~ ^[0-9]{6}$ ]]; then
              echo "Error: Invalid OTP format. Expected 6 digits."
              exit 1
            fi
            OTP_ARG="--otp=$OTP_INPUT"
          fi

          echo "🚀 Initializing NPM Publish environment..."
          echo "  Node version : $(node -v)"
          echo "  NPM version  : $(npx --yes npm@latest -v)"

          # Attempt 1: Trusted Publishing (OIDC Provenance) with npm@latest (v11+)
          echo "🚀 Attempting publish via npm Trusted Publishing (OIDC / Provenance)..."
          rm -f ~/.npmrc
          if npx --yes npm@latest publish --provenance --access public $OTP_ARG; then
            echo "✅ Successfully published to NPM via OIDC Trusted Publishing!"
            exit 0
          fi

          # Attempt 2: Fallback to NPM_TOKEN if OIDC is rejected or unconfigured
          if [ -n "$LEGACY_TOKEN" ]; then
            echo "⚠️ OIDC Trusted Publishing failed. Falling back to NPM_TOKEN authentication..."
            echo "//registry.npmjs.org/:_authToken=$LEGACY_TOKEN" > ~/.npmrc
            export NODE_AUTH_TOKEN="$LEGACY_TOKEN"
            npx --yes npm@latest publish --access public $OTP_ARG
            exit $?
          else
            echo "❌ NPM Publish failed and no legacy NPM_TOKEN fallback was configured."
            exit 1
          fi
        env:
          LEGACY_TOKEN: ${{ secrets.NPM_TOKEN }}
          OTP_INPUT: ${{ inputs.otp }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  create-release:
    name: Create GitHub Release
    needs: [build-and-verify]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }} — Release ${{ github.ref_name }}
          generate_release_notes: true
