name: Enterprise Automated Quality Gates & Multi-Tier Test CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # ==========================================================================
  # STAGE 1: Static Defect, Coding Standards & Security Sentinel
  # ==========================================================================
  static-gates:
    name: "Gate 1-7: Static Defect & Security Sentinel"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies (Hermetic Lockfile)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Enterprise Full 10 Quality Gates & Integrity Sentinel
        run: python tools/core/verify_all.py --mode hub

      - name: OWASP MASVS Manifest Security Audit
        run: |
          python tools/perf/mobile_resilience_sentinel.py --audit-manifest examples/mobile-crm-suite/manifests/AndroidManifest.xml
          python tools/perf/mobile_resilience_sentinel.py --audit-plist examples/mobile-crm-suite/manifests/Info.plist

      - name: Upload Static Gate Reports
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: static-gate-report
          path: |
            reports/verify_all_report.json
            reports/infer_linter_report.json
          retention-days: 14
          if-no-files-found: ignore

  # ==========================================================================
  # STAGE 2: REST API Automation Test Matrix (Sprint 1)
  # ==========================================================================
  api-suite:
    name: "API Suite: 112 REST TCs (Book & User AUT)"
    needs: [static-gates]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install API Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pydantic pytest

      - name: Run 112 REST API Tests
        env:
          AUT_TEST_PASSWORD: ${{ secrets.AUT_TEST_PASSWORD || 'CI_Test_Pass_2026!' }}
        run: |
          mkdir -p reports
          pytest tests/aut_api -v --junitxml=reports/api_junit.xml

      - name: Upload API Test Artifacts
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: api-test-report
          path: reports/api_junit.xml
          retention-days: 14

  # ==========================================================================
  # STAGE 3: Web UI CRM E2E & DAST Security Suite (Sprint 2 & 3)
  # ==========================================================================
  e2e-crm-suite:
    name: "Web E2E: 74 Playwright TCs (CRM Auth, Customers & DAST)"
    needs: [static-gates]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 20
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "examples/playwright-crm-suite/package-lock.json"

      - name: Install Playwright Dependencies & Chromium
        working-directory: examples/playwright-crm-suite
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Execute Full 74 Playwright Test Matrix
        working-directory: examples/playwright-crm-suite
        run: npx playwright test

      - name: Upload Playwright Test Reports
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: playwright-e2e-report
          path: |
            examples/playwright-crm-suite/playwright-report/
            examples/playwright-crm-suite/reports/junit.xml
          retention-days: 14

  # ==========================================================================
  # STAGE 4: Backend Performance & SLA Sentinel (Sprint 4)
  # ==========================================================================
  perf-sla-sentinel:
    name: "Perf Sentinel: Gate 10 SLA & JTL Analysis"
    needs: [static-gates]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Perf Dependencies
        run: pip install requests

      - name: Run Headless Performance Benchmark
        run: |
          mkdir -p Reports/perf
          python tools/perf/benchmark_perf_runner.py

      - name: Enforce Gate 10 SLA Thresholds
        run: |
          python tools/perf/jtl_analyzer.py Reports/perf/perf_results.jtl --sla-p95 500 --max-error-rate 1.0 --markdown Reports/perf/PERFORMANCE_EXECUTION_REPORT.md --json Reports/perf/perf_metrics.json
          python -c "from tools.core.gates.gate_10_perf_sla import gate_10_performance_sla; import os; assert gate_10_performance_sla(os.getcwd(), 'HUB')"

      - name: Upload Performance Reports
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: performance-sla-report
          path: Reports/perf/
          retention-days: 14

  # ==========================================================================
  # STAGE 5: Mobile Screen Object Model (SOM) Suite (Sprint 5)
  # ==========================================================================
  mobile-som-suite:
    name: "Mobile SOM: 18 Appium TCs & Resilience"
    needs: [static-gates]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Mobile Test Dependencies
        run: pip install pytest

      - name: Run 18 Mobile Screen Object Model Tests
        run: |
          mkdir -p reports
          pytest examples/mobile-crm-suite/tests -v --junitxml=reports/mobile_junit.xml

      - name: Upload Mobile Test Report
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: mobile-som-report
          path: reports/mobile_junit.xml
          retention-days: 14

  # ==========================================================================
  # STAGE 6: Final DoD Acceptance & GitHub Step Summary
  # ==========================================================================
  dod-acceptance:
    name: "Final DoD: Quality Gatekeeper Acceptance"
    needs: [api-suite, e2e-crm-suite, perf-sla-sentinel, mobile-som-suite]
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 10

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Download Test Artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: artifacts/

      - name: Generate Executive DoD Job Summary
        run: python tools/report/ci_summary_generator.py --artifacts-dir artifacts/ --output "$GITHUB_STEP_SUMMARY"
