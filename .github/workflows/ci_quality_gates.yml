name: Enterprise Automated Quality Gates & Multi-Tier Test CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_candidate:
        description: "Run explicit live release-candidate evidence lane"
        required: false
        type: boolean
        default: false
      release_env:
        description: "Named target environment for release-candidate lane"
        required: false
        type: string
        default: "staging"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # ==========================================================================
  # STAGE 1: Static Defect, Coding Standards & Security Sentinel
  # ==========================================================================
  static-gates:
    name: "Gate 1-7: Static Defect & Security Sentinel"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies (Hermetic Lockfile)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Author Attribution & Cryptographic Provenance Sentinel
        run: python tools/core/author_integrity.py

      - name: Enterprise Full 11 Quality Gates & Integrity Sentinel
        run: python tools/core/verify_all.py --mode hub --fast

      - name: OWASP MASVS Manifest Security Audit
        run: |
          python tools/perf/mobile_resilience_sentinel.py --audit-manifest examples/mobile-crm-suite/manifests/AndroidManifest.xml
          python tools/perf/mobile_resilience_sentinel.py --audit-plist examples/mobile-crm-suite/manifests/Info.plist

      - name: Upload Static Gate Reports
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: static-gate-report
          path: |
            reports/verify_all_report.json
            reports/infer_linter_report.json
          retention-days: 14
          if-no-files-found: ignore

  # ==========================================================================
  # STAGE 2: REST API Automation Test Matrix (Sprint 1)
  # ==========================================================================
  api-suite:
    name: "API Suite: 112 REST TCs (Book & User AUT)"
    needs: [static-gates]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install API Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pydantic pytest

      - name: Run 112 REST API Tests
        env:
          AUT_TEST_PASSWORD: ${{ secrets.AUT_TEST_PASSWORD || 'CI_Test_Pass_2026!' }}
          SYNAPSE_API_OFFLINE: "1"
        run: |
          mkdir -p reports
          pytest tests/aut_api -v --junitxml=reports/api_junit.xml

      - name: Upload API Test Artifacts
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: api-test-report
          path: reports/api_junit.xml
          retention-days: 14

  # ==========================================================================
  # STAGE 3: Web UI CRM E2E & DAST Security Suite (Sprint 2 & 3)
  # ==========================================================================
  e2e-crm-suite:
    name: "Web E2E: 74 Playwright TCs (CRM Auth, Customers & DAST) (Shard ${{ matrix.shard }})"
    needs: [static-gates]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 20
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "examples/playwright-crm-suite/package-lock.json"

      - name: Install Playwright Dependencies & Browsers (Chromium, Firefox, WebKit)
        working-directory: examples/playwright-crm-suite
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit

      - name: Execute Playwright Test Shard
        working-directory: examples/playwright-crm-suite
        env:
          CRM_USER: ${{ secrets.CRM_USER || 'admin@example.com' }}
          CRM_PASS: ${{ secrets.CRM_PASS || '123456' }}
        run: npx playwright test --shard=${{ matrix.shard }}

      - name: Upload Playwright Test Reports
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: playwright-e2e-report-${{ strategy.job-index }}
          path: |
            examples/playwright-crm-suite/playwright-report/
            examples/playwright-crm-suite/reports/junit.xml
          retention-days: 14

  # ==========================================================================
  # STAGE 4: Backend Performance & SLA Sentinel (Sprint 4)
  # ==========================================================================
  perf-sla-sentinel:
    name: "Perf Sentinel: Gate 10 SLA & JTL Analysis"
    needs: [static-gates]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Perf Dependencies
        run: pip install requests

      - name: Run Headless Performance Benchmark
        run: |
          mkdir -p reports/perf
          python tools/perf/benchmark_perf_runner.py

      - name: Enforce Gate 10 SLA Thresholds
        run: |
          python tools/perf/jtl_analyzer.py reports/perf/perf_results.jtl --sla-p95 500 --max-error-rate 1.0 --markdown reports/perf/PERFORMANCE_EXECUTION_REPORT.md --json reports/perf/perf_metrics.json
          python -c "from tools.core.gates.gate_10_perf_sla import gate_10_performance_sla; import os; assert gate_10_performance_sla(os.getcwd(), 'HUB')"

      - name: Upload Performance Reports
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: performance-sla-report
          path: reports/perf/
          retention-days: 14

  # ==========================================================================
  # STAGE 5: Mobile Screen Object Model (SOM) Suite (Sprint 5)
  # ==========================================================================
  mobile-som-suite:
    name: "Mobile SOM: 18 Appium TCs & Resilience"
    needs: [static-gates]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Mobile Test Dependencies
        run: pip install pytest

      - name: Run 18 Mobile Screen Object Model Tests
        run: |
          mkdir -p reports
          pytest examples/mobile-crm-suite/tests -v --junitxml=reports/mobile_junit.xml

      - name: Upload Mobile Test Report
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: mobile-som-report
          path: reports/mobile_junit.xml
          retention-days: 14

  # ==========================================================================
  # STAGE 5B: Audit Ratchet Enforcement & Schema/Telemetry Verification
  # ==========================================================================
  audit-ratchet-verification:
    name: "Audit Ratchet: P0/P1/P2 Enforcement & Telemetry"
    needs: [static-gates]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies (Hermetic Lockfile)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Run P0/P1/P2 Ratchet Verification Suites
        run: |
          mkdir -p reports
          pytest tests/test_cli_schema_sentinel.py tests/test_gate_11_all_15_tiers.py tests/test_token_estimator.py tests/test_task_memory_manager.py tests/test_token_engineering_and_benchmark.py tests/test_level4_adaptive.py -v --junitxml=reports/ratchet_junit.xml
          python tools/lint/cli_schema_sentinel.py --check --fail-unregistered --json > reports/cli_schema_drift.json
          python tools/lint/invariant_checker.py --json > reports/invariant_check.json
          python tools/core/verify_all.py --mode hub --fast --format json > reports/verify_all_ratchet.json

      - name: Upload Audit Ratchet Artifacts
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: audit-ratchet-report
          path: |
            reports/ratchet_junit.xml
            reports/cli_schema_drift.json
            reports/invariant_check.json
            reports/verify_all_ratchet.json
          retention-days: 14
          if-no-files-found: ignore

  # ==========================================================================
  # STAGE 5C: Explicit Release-Candidate Evidence Lane (Opt-In Dispatch)
  # ==========================================================================
  rc-evidence-lane:
    name: "Release Candidate: Live Staging, Browser Matrix, Mobile & k6"
    if: github.event_name == 'workflow_dispatch' && inputs.release_candidate == true
    needs: [static-gates]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node.js 20
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 20

      - name: Validate Operator-Provided Release Targets
        env:
          BOOK_API_BASE_URL: ${{ vars.STAGING_API_URL || secrets.STAGING_API_URL }}
          CRM_BASE_URL: ${{ vars.STAGING_CRM_URL || secrets.STAGING_CRM_URL }}
          APPIUM_SERVER_URL: ${{ vars.STAGING_APPIUM_URL || secrets.STAGING_APPIUM_URL }}
          K6_TARGET_URL: ${{ vars.STAGING_K6_URL || secrets.STAGING_K6_URL }}
        run: |
          for v in BOOK_API_BASE_URL CRM_BASE_URL APPIUM_SERVER_URL K6_TARGET_URL; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing required release-candidate target $v"
              exit 1
            fi
          done

      - name: Install Playwright Browsers (Chromium, Firefox, WebKit)
        working-directory: examples/playwright-crm-suite
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit

      - name: Run Accessibility Pilot (Chromium)
        working-directory: examples/playwright-crm-suite
        env:
          SYNAPSE_WEB_MODE: offline
        run: npx playwright test accessibility.spec.ts --project=chromium

      - name: Record Candidate Evidence Manifest
        env:
          RC_ENV: ${{ inputs.release_env }}
        run: |
          mkdir -p reports
          python3 -c "import json, os; json.dump({'build_id': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'], 'job': 'rc-evidence-lane', 'environment': os.environ.get('RC_ENV', 'staging'), 'lane': 'release-candidate'}, open('reports/candidate_manifest.json', 'w', encoding='utf-8'), indent=2)"

      - name: Upload Release Candidate Manifest
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: rc-candidate-manifest
          path: |
            reports/candidate_manifest.json
            examples/playwright-crm-suite/reports/a11y_receipt.json
          retention-days: 14

  # ==========================================================================
  # STAGE 6: Final DoD Acceptance & GitHub Step Summary
  # ==========================================================================
  dod-acceptance:
    name: "Final DoD: Quality Gatekeeper Acceptance"
    needs: [api-suite, e2e-crm-suite, perf-sla-sentinel, mobile-som-suite, audit-ratchet-verification, rc-evidence-lane]
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 10

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Download Test Artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: artifacts/

      - name: Generate Executive DoD Job Summary
        env:
          SYNAPSE_CANDIDATE_BUILD: ${{ (github.event_name == 'workflow_dispatch' && inputs.release_candidate == true) && github.sha || '' }}
          SYNAPSE_RUN_ID: ${{ (github.event_name == 'workflow_dispatch' && inputs.release_candidate == true) && github.run_id || '' }}
          SYNAPSE_RELEASE_ENV: ${{ (github.event_name == 'workflow_dispatch' && inputs.release_candidate == true) && inputs.release_env || '' }}
        run: python tools/report/ci_summary_generator.py --artifacts-dir artifacts/ --output "$GITHUB_STEP_SUMMARY"

      - name: Send Telegram Executive CI/CD Notification
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          STATUS="${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 'failure' || 'success' }}"
          python tools/core/telegram_bot.py --ci-notify --ci-status "$STATUS"
