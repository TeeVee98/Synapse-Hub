name: Enterprise Security & Supply Chain Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run every Monday at 02:00 UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  security-audit:
    name: Security Sentinel & SBOM Provenance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'

      - name: Install dependencies & security auditors (Hermetic Lockfile)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '22.x'

      - name: Generate SPDX 2.3 JSON SBOM
        run: |
          python tools/generate_sbom.py --output reports/synapse_hub_sbom.spdx.json

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: synapse-hub-sbom-spdx
          path: reports/synapse_hub_sbom.spdx.json

      - name: Run Multi-Layer Security Scanner
        run: |
          python tools/security_scanner.py

      - name: Run 10 Quality Gates DoD Verification
        run: |
          python tools/verify_all.py --mode hub
