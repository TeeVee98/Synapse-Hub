name: Enterprise Security & Supply Chain Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run every Monday at 02:00 UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  security-audit:
    name: Security Sentinel & SBOM Provenance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies & security auditors (Hermetic Lockfile)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'

      - name: Generate SPDX 2.3 JSON SBOM
        run: |
          python tools/generate_sbom.py --output reports/synapse_hub_sbom.spdx.json

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: synapse-hub-sbom-spdx
          path: reports/synapse_hub_sbom.spdx.json

      - name: Run Multi-Layer Security Scanner
        run: |
          python tools/security_scanner.py

      - name: Run 10 Quality Gates DoD Verification
        run: |
          python tools/verify_all.py --mode hub
