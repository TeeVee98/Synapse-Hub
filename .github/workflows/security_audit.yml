name: Enterprise Security & Supply Chain Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run every Monday at 02:00 UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  security-audit:
    name: Security Sentinel & SBOM Provenance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install dependencies & security auditors (Hermetic Lockfile)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.x'

      - name: Generate SPDX 2.3 JSON SBOM
        run: |
          python tools/report/generate_sbom.py --output reports/synapse_hub_sbom.spdx.json

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synapse-hub-sbom-spdx
          path: reports/synapse_hub_sbom.spdx.json

      - name: Run Multi-Layer Security Scanner
        run: |
          python tools/security/security_scanner.py

      - name: Run 10 Quality Gates DoD Verification
        run: |
          python tools/core/verify_all.py --mode hub
