name: Skills Hub Quality & Integrity Sentinel

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  validate-skills:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Validate SKILL.md Frontmatter and Manifest
        shell: bash
        run: |
          python tools/skillspector.py .agents/skills

      - name: Verify Universal Version Synchronization
        shell: bash
        run: |
          python tools/check_version_sync.py

      - name: Run Code Health & Type Quality Audits
        shell: bash
        run: |
          ruff check tools tests scripts
          mypy tools --ignore-missing-imports

      - name: Run Static Application Security Testing (SAST)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        shell: bash
        run: |
          # Suppressions rationale: B103 (POSIX CLI chmod), B314 (stdlib JUnit XML parsing), B608 (local SQLite '?'-bound cache)
          bandit -r tools/ -ll -s B103,B314,B608 -q
          pip-audit -r requirements-dev.txt

      - name: Verify 10 DoD Quality Gates
        shell: bash
        run: |
          python tools/verify_all.py --mode hub

      - name: Run Cross-Platform CLI Tools Smoke Test Matrix
        shell: bash
        run: |
          python tests/test_cli_smoke.py

      - name: Run Centralized Tooling Unit & Functional Tests with Line Coverage
        shell: bash
        run: |
          python -m pytest tests -q --cov=tools --cov-report=term

      - name: Verify Documentation & Tool References Integrity
        shell: bash
        run: |
          python tools/lint_ai_docs.py

      - name: Verify AI Agent Rules & IDE Bridges Synchronization
        shell: bash
        run: |
          python tools/sync_agent_rules.py --check

      - name: Verify Package Distribution Parity (NPM Pack Dry-Run)
        shell: bash
        run: |
          npm pack --dry-run

      - name: Run Benchmark Evaluation Suite
        shell: bash
        run: |
          python benchmarks/qa_eval/eval_runner.py
