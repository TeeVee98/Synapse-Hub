name: Nightly Dynamic AST Mutation Sentinel

on:
  schedule:
    # Run nightly at 02:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly-mutation:
    name: AST Dynamic Mutation Verification (Kill Score >= 80%)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Dynamic AST Mutation Verification
        shell: bash
        run: |
          python tools/lint/micro_mutator.py --test-cmd "pytest tests -q" --min-score 80.0 --baseline reports/mutant_baseline.json

      - name: Upload Mutation Baseline Artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-mutation-baseline
          path: reports/mutant_baseline.json
          if-no-files-found: ignore
