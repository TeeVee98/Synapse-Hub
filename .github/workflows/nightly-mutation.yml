name: Nightly Dynamic AST Mutation Sentinel

on:
  schedule:
    # Run nightly at 02:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly-mutation:
    name: AST Dynamic Mutation Verification (Kill Score >= 80%)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@0b93645e9dc2c79245ae286e29f3cc0e684bc0c1 # v5.3.0
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@1e60f620b7ed410f148201a3981fce0164e860c4 # v4.2.0
        with:
          node-version: "22"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Dynamic AST Mutation Verification
        shell: bash
        run: |
          python tools/micro_mutator.py --test-cmd "pytest tests -q" --min-score 80.0 --baseline reports/mutant_baseline.json

      - name: Upload Mutation Baseline Artifact
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb99baeddf # v4.6.1
        with:
          name: nightly-mutation-baseline
          path: reports/mutant_baseline.json
          if-no-files-found: ignore
