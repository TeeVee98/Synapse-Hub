name: Publish Python Package to PyPI (OIDC Trusted Publishing)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build-sdist-wheel:
    name: Verify 11 Quality Gates & Build PEP 621 Distribution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
      SYNAPSE_API_OFFLINE: "1"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install build & verification dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          pip install -r requirements-dev.txt

      - name: Verify Author Attribution & Provenance Guard
        run: python tools/core/author_integrity.py

      - name: Verify Tag Version Synchronization
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VER="${GITHUB_REF#refs/tags/v}"
          python tools/core/check_version_sync.py --expected-version "$TAG_VER"

      - name: Run Full 11 Quality Gates DoD Verification
        run: python tools/core/verify_all.py --mode hub --parallel

      - name: Build PEP 621 sdist and wheel
        run: |
          python -m build --sdist --wheel --outdir dist/
          python -m twine check --strict dist/*

      - name: Upload Python distribution artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: python-package-distributions
          path: dist/
          retention-days: 7

  publish-pypi:
    name: Publish synapse-hub to PyPI via PEP 740 OIDC
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify-and-build-sdist-wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/synapse-hub
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download built sdist and wheel artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distribution to PyPI via Trusted Publisher
        uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc # v1.12.4
        with:
          packages-dir: dist/
          skip-existing: true
          attestations: true
