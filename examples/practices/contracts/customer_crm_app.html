<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Synapse CRM — Quản lý Khách hàng Doanh nghiệp</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f8fafc; padding: 2rem; color: #1e293b; }
    .card { background: #ffffff; border-radius: 8px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); padding: 2rem; max-width: 650px; margin: 0 auto; }
    h1 { font-size: 1.5rem; margin-bottom: 1.5rem; color: #0f172a; border-bottom: 2px solid #e2e8f0; padding-bottom: 0.75rem; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; font-weight: 600; margin-bottom: 0.35rem; font-size: 0.875rem; }
    label .req { color: #ef4444; }
    input, select { width: 100%; box-sizing: border-box; padding: 0.5rem 0.75rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.925rem; }
    input:focus, select:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); }
    .btn-group { display: flex; gap: 0.75rem; margin-top: 1.5rem; }
    button { padding: 0.6rem 1.25rem; font-size: 0.925rem; font-weight: 600; border-radius: 6px; cursor: pointer; border: none; }
    .btn-primary { background: #2563eb; color: #ffffff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-primary:disabled { background: #94a3b8; cursor: not-allowed; }
    .btn-secondary { background: #e2e8f0; color: #334155; }
    .alert { padding: 0.75rem 1rem; border-radius: 6px; margin-top: 1rem; display: none; font-size: 0.875rem; }
    .alert-success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
    .alert-danger { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
  </style>
</head>
<body>
  <div class="card">
    <nav style="margin-bottom: 1rem; font-size: 0.875rem; color: #64748b;">
      <a href="#dashboard" style="color: #2563eb; text-decoration: none;">Dashboard</a> &gt;
      <a href="#customers" style="color: #2563eb; text-decoration: none;">Khách hàng</a> &gt;
      <span>Tạo mới</span>
    </nav>

    <h1>Thêm mới Khách hàng Doanh nghiệp</h1>

    <form id="customer-form" onsubmit="handleFormSubmit(event)">
      <div class="form-group">
        <label for="company">Tên công ty <span class="req">*</span></label>
        <input type="text" id="company" name="company" placeholder="Nhập tên doanh nghiệp..." maxlength="100" required>
      </div>

      <div class="form-group">
        <label for="name">Người liên hệ <span class="req">*</span></label>
        <input type="text" id="name" name="name" placeholder="Họ và tên người đại diện..." maxlength="100" required>
      </div>

      <div class="form-group">
        <label for="email">Email liên hệ <span class="req">*</span></label>
        <input type="email" id="email" name="email" placeholder="email@company.com" required>
      </div>

      <div class="form-group">
        <label for="phone">Số điện thoại</label>
        <input type="tel" id="phone" name="phone" placeholder="0912345678" maxlength="15">
      </div>

      <div class="form-group">
        <label for="vat">Mã số thuế</label>
        <input type="text" id="vat" name="vat" placeholder="0101234567" maxlength="20">
      </div>

      <div class="form-group">
        <label for="website">Website</label>
        <input type="url" id="website" name="website" placeholder="https://example.com">
      </div>

      <div class="form-group">
        <label for="status">Trạng thái hoạt động</label>
        <select id="status" name="status">
          <option value="ACTIVE" selected>Hoạt động</option>
          <option value="INACTIVE">Tạm ngưng</option>
        </select>
      </div>

      <!-- Test elements for drift and blocked interaction -->
      <button type="button" id="btn-disabled" class="btn-secondary" disabled style="display: none;">Nút bị vô hiệu hoá</button>
      <div id="hidden-box" hidden>Phần tử ẩn</div>

      <div class="btn-group">
        <button type="submit" id="btn-submit" class="btn-primary">Lưu khách hàng</button>
        <button type="reset" id="btn-cancel" class="btn-secondary">Hủy bỏ</button>
      </div>
    </form>

    <div id="alert-success" class="alert alert-success" role="alert">
      Khách hàng đã được tạo thành công! Mã khách hàng: <strong id="res-id">CUST-8891</strong>
    </div>
    <div id="alert-error" class="alert alert-danger" role="alert">
      Có lỗi xảy ra trong quá trình lưu dữ liệu.
    </div>
  </div>

  <script>
    function handleFormSubmit(e) {
      e.preventDefault();
      const comp = document.getElementById('company').value.trim();
      const email = document.getElementById('email').value.trim();
      if (!comp || !email) {
        document.getElementById('alert-error').style.display = 'block';
        document.getElementById('alert-success').style.display = 'none';
        return;
      }
      document.getElementById('alert-error').style.display = 'none';
      document.getElementById('alert-success').style.display = 'block';
      document.getElementById('res-id').textContent = 'CUST-' + Math.floor(1000 + Math.random() * 9000);
    }
  </script>
</body>
</html>
