name: Synapse QA Quality Gate & DoD Sentinel

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, develop, master ]

permissions:
  contents: read
  pull-requests: write

jobs:
  quality-gate:
    name: DoD Quality Gates & AI Test Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project Source
        uses: actions/checkout@v4

      - name: Setup Node.js (NPX Runner)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Test Quality Linter (Fake-Pass & Sleep Detection)
        id: lint
        continue-on-error: true
        run: |
          mkdir -p reports
          npx synapse-hub lint --json > reports/infer_linter_report.json || true
          cat reports/infer_linter_report.json || true

      - name: Run 11 Quality Gates DoD Verification
        id: verify
        run: |
          npx synapse-hub verify

      - name: Generate GitHub Step Summary
        if: always()
        run: |
          echo "## 🧠 Synapse QA Quality Gate Scorecard" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check / Gate | Result | Notes |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :---: | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Gate 0–10 DoD Verification** | ${{ steps.verify.outcome == 'success' && '✅ PASS' || '❌ FAIL' }} | Enforced 11 Quality Gates |" >> $GITHUB_STEP_SUMMARY
          echo "| **AST Fake-Pass Linter** | ${{ steps.lint.outcome == 'success' && '✅ CLEAN' || '⚠️ FINDINGS' }} | Scanned zero asserts, sleeps & empty catches |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> *Generated by [Synapse Hub](https://github.com/TeeVee998/Synapse-Hub) — Test Quality Linter & Guardrails for AI-Generated Tests.*" >> $GITHUB_STEP_SUMMARY

      - name: Comment DoD Scorecard on Pull Request
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const verifySuccess = '${{ steps.verify.outcome }}' === 'success';
            const lintSuccess = '${{ steps.lint.outcome }}' === 'success';
            const statusIcon = verifySuccess ? '✅' : '❌';

            const body = `### ${statusIcon} Synapse QA Quality Gate Report
            | Quality Gate | Status | Description |
            | :--- | :---: | :--- |
            | **11 DoD Quality Gates** | ${verifySuccess ? '✅ PASSED' : '❌ FAILED'} | UTF-8, Path Portability, Clean POM, Secret Security, Mutation & SLA Sentinel |
            | **AST Test Linter** | ${lintSuccess ? '✅ PASSED' : '⚠️ FINDINGS'} | Zero Fake-Pass, No Hardcoded Sleeps, No Swallowed Catches |

            *Automated gatekeeper powered by [Synapse Hub](https://github.com/TeeVee998/Synapse-Hub).*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c => c.body.includes('Synapse QA Quality Gate Report'));

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }
